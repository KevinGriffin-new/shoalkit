[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shoalkit"
dynamic = ["version"]
description = "Linear and Stokes wave transformation with Lagrangian drift"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["ocean waves", "linear wave theory", "Stokes waves", "Stokes drift",
            "Lagrangian transport", "particle tracking", "dispersion",
            "shoaling", "refraction", "Ursell number", "coastal engineering",
            "physical oceanography", "hydrography", "bathymetry"]
authors = [
  { name = "Kevin Griffin", email = "thymine-coyest1d@icloud.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Oceanography",
]
dependencies = []   # core is pure-stdlib

[project.optional-dependencies]
nonlinear = ["raschii>=1.0", "numpy"]   # higher-order Stokes / Fenton profiles
viz = ["numpy", "matplotlib"]           # examples/drift_animation.py
test = ["pytest>=7"]
dev = ["pytest>=7", "raschii>=1.0", "numpy", "ruff"]

[project.urls]
Homepage = "https://github.com/KevinGriffin-new/shoalkit"
Repository = "https://github.com/KevinGriffin-new/shoalkit"
Issues = "https://github.com/KevinGriffin-new/shoalkit/issues"

# Single source of truth for the version: src/shoalkit/__init__.py.
# tools/check_metadata.py asserts CITATION.cff and the git tag agree with it.
[tool.hatch.version]
path = "src/shoalkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shoalkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
