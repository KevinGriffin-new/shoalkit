name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with nonlinear extra for the raschii cross-check)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,nonlinear]"
      - name: Run tests
        run: pytest -q

  # The version lives in src/shoalkit/__init__.py and the subtitle in five
  # files. Nothing used to cross-check them, and they drifted twice. This job
  # is that check. It matters most on a tag: the Zenodo webhook mints from the
  # tag, and a minted DOI cannot be edited afterwards.
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check metadata consistency
        run: python tools/check_metadata.py
