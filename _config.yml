# Jekyll config for the GitHub Pages site.
#
# Until now there was no _config.yml at all, so GitHub injected a default one
# and Jekyll published the ENTIRE repository root — src/, tests/, paper/ and
# pyproject.toml were all live on kevingriffin-new.github.io. This file makes
# the published set explicit.
#
# title/description were previously taken from the GitHub repo description.
# They are pinned here so the site stops drifting from the paper.

title: shoalkit
description: >-
  Linear and Stokes wave transformation with Lagrangian drift

# The theme GitHub was applying by default. Pinned so switching the build to
# Actions does not change how the site looks.
theme: jekyll-theme-primer

plugins:
  - jekyll-seo-tag

# Published: README.md (renders as the landing page), web/ (the browser wave
# calculator and its font licences), docs/ (the drift figure and animation).
#
# Everything below is repository content, not website content. Dotfiles
# (.github/, .zenodo.json, .build.yml, .gitignore) are excluded by Jekyll
# automatically and do not need listing.
exclude:
  - src/
  - tests/
  - paper/
  - examples/
  - pyproject.toml
  - CITATION.cff
  - CONTRIBUTING.md
  - README.md.bak
